 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro Técnico EH-LVB</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --bg: #000000;
            --card: #121212;
            --input: #2a2a2a;
            --border: #333333;
            --accent: #00a8ff;
            --text: #ffffff;
        }

        body { 
            background-color: var(--bg); color: var(--text); 
            font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px;
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            width: 100%; max-width: 450px; background: var(--card);
            padding: 25px; border-radius: 20px; border: 1px solid var(--border);
            box-sizing: border-box; display: block !important;
        }

        .header { text-align: center; margin-bottom: 25px; }
        .id-label { 
            background: var(--accent); padding: 8px 20px; 
            border-radius: 50px; font-weight: bold; font-size: 0.9em; 
            color: white; display: inline-block;
        }

        .form-group { margin-bottom: 20px; }
        label { 
            display: flex; align-items: center; gap: 8px;
            font-size: 0.75em; color: #888; margin-bottom: 8px; text-transform: uppercase;
        }

        .input-box { position: relative; display: flex; align-items: center; }
        .input-box span { position: absolute; left: 12px; color: var(--accent); font-size: 20px; }

        input, select, textarea {
            width: 100%; padding: 12px 12px 12px 42px;
            background: var(--input); border: 1px solid var(--border);
            color: white; border-radius: 10px; font-size: 16px; box-sizing: border-box;
        }

        .btn-submit {
            width: 100%; background: var(--accent); color: white; border: none;
            padding: 16px; border-radius: 12px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-top: 10px; font-size: 1em;
        }

        .btn-clear {
            width: 100%; background: transparent; color: #ff5252; border: 1px solid #ff5252;
            padding: 12px; border-radius: 12px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin-top: 15px; font-size: 0.9em;
        }

        #status { display: none; text-align: center; margin-top: 15px; font-weight: bold; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="container" id="formContainer">
    <div class="header">
        <span class="id-label" id="displayID">ESCANEE CÓDIGO</span>
    </div>

    <form id="mainForm">
        <input type="hidden" id="hojaCodigo">

        <div class="form-group">
            <label>Fecha y Hora (Col A)</label>
            <div class="input-box">
                <span class="material-symbols-rounded">calendar_today</span>
                <input type="datetime-local" id="fechaHora" required>
            </div>
        </div>

        <div class="form-group">
            <label>Duración (Col B, C, D)</label>
            <div class="input-box">
                <span class="material-symbols-rounded">timer</span>
                <input type="text" id="duracion" placeholder="Ej: 30 min / 1 hora" required>
            </div>
        </div>

        <div class="form-group">
            <label>Responsable (Col E, F)</label>
            <div class="input-box">
                <span class="material-symbols-rounded">person</span>
                <input type="text" id="responsable" placeholder="Nombre del técnico" required>
            </div>
        </div>

        <div class="form-group">
            <label>Tipo (Col G, H)</label>
            <div class="input-box">
                <span class="material-symbols-rounded">settings</span>
                <select id="tipo" required>
                    <option value="">Seleccione...</option>
                    <option value="preventivo">Preventivo</option>
                    <option value="correctivo">Correctivo</option>
                    <option value="programado">Programado</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Descripción (Col I, J)</label>
            <div class="input-box">
                <span class="material-symbols-rounded" style="top:12px">edit_note</span>
                <textarea id="descripcion" rows="3" placeholder="Detalle la actividad..." required style="padding-top:12px; padding-left: 42px;"></textarea>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
                <label>Foto Antes (K)</label>
                <input type="file" id="foto1" accept="image/*" capture="camera" style="padding-left:10px; font-size: 10px;">
            </div>
            <div class="form-group">
                <label>Foto Después (L)</label>
                <input type="file" id="foto2" accept="image/*" capture="camera" style="padding-left:10px; font-size: 10px;">
            </div>
        </div>

        <button type="submit" class="btn-submit" id="btnS">
            <span class="material-symbols-rounded">cloud_upload</span> GUARDAR REGISTRO
        </button>
        
        <button type="button" class="btn-clear" onclick="window.location.reload()">
            <span class="material-symbols-rounded">delete</span> LIMPIAR TODO
        </button>
    </form>
    
    <div id="status"></div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz98xny-dI8JXlQo0Q4imoaIJ7eqtK9E_N-04jJ9UtkADzzgP-j3gBsXStq0UCoNF8aKQ/exec";

    window.onload = () => {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('id');
        if(code) {
            document.getElementById('hojaCodigo').value = code;
            document.getElementById('displayID').innerText = "ID: " + code;
        }
        
        const ahora = new Date();
        ahora.setMinutes(ahora.getMinutes() - ahora.getTimezoneOffset());
        document.getElementById('fechaHora').value = ahora.toISOString().slice(0,16);

        // Intentar enviar datos apenas cargue la página si hay internet
        setTimeout(checkOfflineData, 1000);
    };

    const toBase64 = file => new Promise((resolve) => {
        if(!file) return resolve(null);
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(file);
    });

    document.getElementById('mainForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnS');
        const st = document.getElementById('status');
        
        btn.disabled = true;
        st.style.display = "block";
        st.innerText = "⏳ Procesando...";
        st.style.color = "#00a8ff";

        // Convertir fotos
        const f1 = await toBase64(document.getElementById('foto1').files[0]);
        const f2 = await toBase64(document.getElementById('foto2').files[0]);

        const payload = {
            hojaCodigo: document.getElementById('hojaCodigo').value || "SIN_ID",
            fechaHora: document.getElementById('fechaHora').value,
            duracion: document.getElementById('duracion').value,
            responsable: document.getElementById('responsable').value,
            tipo: document.getElementById('tipo').value,
            descripcion: document.getElementById('descripcion').value,
            fotoAntes: f1,
            fotoDespues: f2,
            timestamp: new Date().getTime()
        };

        if (navigator.onLine) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000); // 15 seg timeout

                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                if (navigator.vibrate) navigator.vibrate(200); 
                st.innerText = "✅ Registro Enviado";
                st.style.color = "#00ff88";
                setTimeout(() => window.location.reload(), 2000);
            } catch (error) {
                saveLocally(payload, st);
            }
        } else {
            saveLocally(payload, st);
        }
    };

    function saveLocally(payload, st) {
        let pending = JSON.parse(localStorage.getItem('pendingSync') || "[]");
        pending.push(payload);
        localStorage.setItem('pendingSync', JSON.stringify(pending));
        
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]); 
        st.innerText = "⚠️ Sin internet. Guardado para reenvío automático.";
        st.style.color = "#ff9800";
        
        setTimeout(() => {
            document.getElementById('mainForm').reset();
            btnS.disabled = false;
            st.style.display = "none";
            window.location.reload();
        }, 3000);
    }

    async function checkOfflineData() {
        if (!navigator.onLine) return;

        let pending = JSON.parse(localStorage.getItem('pendingSync') || "[]");
        if (pending.length === 0) return;

        console.log("Intentando sincronizar " + pending.length + " registros...");
        
        const currentPending = [...pending];
        
        for (let i = 0; i < currentPending.length; i++) {
            try {
                await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify(currentPending[i]) 
                });
                
                // Si funcionó, lo quitamos de la lista
                let updated = JSON.parse(localStorage.getItem('pendingSync') || "[]");
                updated = updated.filter(item => item.timestamp !== currentPending[i].timestamp);
                localStorage.setItem('pendingSync', JSON.stringify(updated));
                
                console.log("Registro sincronizado con éxito.");
            } catch (err) {
                console.log("Fallo sincronización, reintentando luego...");
                break; 
            }
        }

        if (JSON.parse(localStorage.getItem('pendingSync')).length === 0) {
            if (navigator.vibrate) navigator.vibrate([50, 50, 50]);
            console.log("Todo sincronizado.");
        }
    }

    // Detectar cambio de red
    window.addEventListener('online', () => {
        console.log("Internet detectado. Sincronizando...");
        checkOfflineData();
    });
</script>
</body>
</html>
