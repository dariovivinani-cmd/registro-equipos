 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro EH-LVB</title>
    <style>
        :root { --bg: #000000; --card: #121212; --accent: #00a8ff; --text: #ffffff; --danger: #ff4757; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 450px; background: var(--card); padding: 20px; border-radius: 15px; border: 1px solid #333; }
        .id-label { background: var(--accent); padding: 5px 15px; border-radius: 20px; font-size: 0.8em; margin-bottom: 20px; display: inline-block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.7em; color: #888; margin-bottom: 5px; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .btn-submit { width: 100%; background: var(--accent); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 1em; cursor: pointer; margin-top: 10px; }
        .btn-reset { width: 100%; background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 10px; border-radius: 10px; font-weight: bold; font-size: 0.9em; cursor: pointer; margin-top: 10px; }
        #status { display: none; text-align: center; margin-top: 15px; padding: 10px; border-radius: 5px; font-weight: bold; }
        #pendingInfo { display: none; background: #e67e22; color: white; padding: 8px; text-align: center; border-radius: 5px; margin-bottom: 10px; font-size: 0.8em; }
    </style>
</head>
<body>

<div class="container">
    <div id="pendingInfo">⚠️ Tienes registros pendientes por enviar</div>
    <div class="header" style="text-align:center">
        <span class="id-label" id="displayID">CARGANDO ID...</span>
    </div>

    <form id="mainForm">
        <input type="hidden" id="hojaCodigo">
        <div class="form-group"><label>Fecha y Hora</label><input type="datetime-local" id="fechaHora" required></div>
        <div class="form-group"><label>Duración</label><input type="text" id="duracion" placeholder="Ej: 30 min" required></div>
        <div class="form-group"><label>Responsable</label><input type="text" id="responsable" placeholder="Nombre" required></div>
        <div class="form-group">
            <label>Tipo</label>
            <select id="tipo" required>
                <option value="">Seleccione...</option>
                <option value="preventivo">Preventivo</option>
                <option value="correctivo">Correctivo</option>
            </select>
        </div>
        <div class="form-group"><label>Descripción</label><textarea id="descripcion" rows="3" required></textarea></div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group"><label>Foto Antes</label><input type="file" id="foto1" accept="image/*" capture="camera"></div>
            <div class="form-group"><label>Foto Después</label><input type="file" id="foto2" accept="image/*" capture="camera"></div>
        </div>
        <button type="submit" class="btn-submit" id="btnS">GUARDAR REGISTRO</button>
        <button type="button" class="btn-reset" onclick="limpiarFormulario()">LIMPIAR FORMULARIO</button>
    </form>
    <div id="status"></div>
</div>

<script>
    // URL DE TU APP SCRIPT - VERIFICA QUE SEA LA ACTUAL
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz98xny-dI8JXlQo0Q4imoaIJ7eqtK9E_N-04jJ9UtkADzzgP-j3gBsXStq0UCoNF8aKQ/exec";

    function setFechaActual() {
        const ahora = new Date();
        ahora.setMinutes(ahora.getMinutes() - ahora.getTimezoneOffset());
        document.getElementById('fechaHora').value = ahora.toISOString().slice(0,16);
    }

    function limpiarFormulario() {
        if(confirm("¿Borrar datos?")) {
            document.getElementById('mainForm').reset();
            setFechaActual();
            document.getElementById('status').style.display = "none";
        }
    }

    window.onload = () => {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('id');
        if(code) {
            document.getElementById('hojaCodigo').value = code;
            document.getElementById('displayID').innerText = "ID: " + code;
        }
        setFechaActual();
        checkQueue();
    };

    const resizeImage = (file) => new Promise((resolve) => {
        if (!file) return resolve(null);
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX = 800;
                let w = img.width, h = img.height;
                if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } }
                else { if (h > MAX) { w *= MAX / h; h = MAX; } }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL('image/jpeg', 0.7));
            };
        };
    });

    document.getElementById('mainForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnS');
        const st = document.getElementById('status');
        
        btn.disabled = true;
        st.style.display = "block";
        st.innerText = "⏳ Enviando...";
        st.style.color = "white";

        const payload = {
            id: "ID-" + Date.now(),
            hojaCodigo: document.getElementById('hojaCodigo').value || "SIN_ID",
            fechaHora: document.getElementById('fechaHora').value,
            duracion: document.getElementById('duracion').value,
            responsable: document.getElementById('responsable').value,
            tipo: document.getElementById('tipo').value,
            descripcion: document.getElementById('descripcion').value,
            fotoAntes: await resizeImage(document.getElementById('foto1').files[0]),
            fotoDespues: await resizeImage(document.getElementById('foto2').files[0])
        };

        try {
            // INTENTO DE ENVÍO DIRECTO
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(payload)
            });

            st.innerText = "✅ ¡Registro Exitoso!";
            st.style.color = "#00ff88";
            document.getElementById('mainForm').reset();
            setFechaActual();
            setTimeout(() => { st.style.display = "none"; btn.disabled = false; }, 2000);

        } catch (error) {
            // SI FALLA (POR INTERNET), GUARDAR EN COLA
            let queue = JSON.parse(localStorage.getItem('cola_v5') || "[]");
            queue.push(payload);
            localStorage.setItem('cola_v5', JSON.stringify(queue));
            
            st.innerText = "⚠️ Guardado en memoria (Sin internet)";
            st.style.color = "#ff9800";
            checkQueue();
            document.getElementById('mainForm').reset();
            setFechaActual();
            setTimeout(() => { st.style.display = "none"; btn.disabled = false; }, 3000);
        }
    };

    async function processQueue() {
        if (!navigator.onLine) return;
        let queue = JSON.parse(localStorage.getItem('cola_v5') || "[]");
        if (queue.length === 0) return;

        // Enviamos el primero de la lista
        const item = queue[0];
        try {
            await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(item) });
            
            // Si funciona, lo quitamos de la lista
            queue.shift();
            localStorage.setItem('cola_v5', JSON.stringify(queue));
            checkQueue();
            
            // Si quedan más, procesar el siguiente tras un breve respiro
            if (queue.length > 0) setTimeout(processQueue, 1000);
        } catch (e) {
            console.log("Error reintentando...");
        }
    }

    function checkQueue() {
        let queue = JSON.parse(localStorage.getItem('cola_v5') || "[]");
        document.getElementById('pendingInfo').style.display = queue.length > 0 ? "block" : "none";
    }

    // Reintentar cuando vuelva el internet
    window.addEventListener('online', processQueue);
    setInterval(processQueue, 60000); // Reintento cada minuto
</script>
</body>
</html>
