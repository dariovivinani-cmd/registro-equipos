 <!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Equipos</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, textarea, button { width: 100%; margin-top: 10px; padding: 10px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #ccc; }
        #mensaje { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="titulo">Cargando...</h2>
    <form id="registroForm">
        <input type="hidden" id="idEquipo" name="id">
        <label>Descripción del estado/mantenimiento:</label>
        <textarea id="descripcion" name="descripcion" rows="4" required placeholder="Escriba aquí..."></textarea>
        <button type="submit" id="btnGuardar">GUARDAR REGISTRO</button>
    </form>
    <div id="mensaje"></div>
</div>

<script>
    // 1. PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT (LA QUE TERMINA EN /exec)
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz98xny-dI8JXlQo0Q4imoaIJ7eqtK9E_N-04jJ9UtkADzzgP-j3gBsXStq0UCoNF8aKQ/exec";

    // Obtener el ID del equipo desde la URL (?id=EH-LVB-001)
    const urlParams = new URLSearchParams(window.location.search);
    const idEquipo = urlParams.get('id') || 'SIN_ID';
    document.getElementById('idEquipo').value = idEquipo;
    document.getElementById('titulo').innerText = "Equipo: " + idEquipo;

    const form = document.getElementById('registroForm');
    const btn = document.getElementById('btnGuardar');
    const mensajeDiv = document.getElementById('mensaje');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        btn.disabled = true;
        btn.innerText = "Enviando...";
        mensajeDiv.style.display = "none";

        const formData = new FormData(form);
        const data = {};
        formData.forEach((value, key) => data[key] = value);

        // Envío de datos mediante fetch (POST)
        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors', // Importante para evitar bloqueos de navegador
            body: new URLSearchParams(formData)
        })
        .then(() => {
            mensajeDiv.innerText = "✅ Registro enviado con éxito";
            mensajeDiv.style.backgroundColor = "#d4edda";
            mensajeDiv.style.color = "#155724";
            mensajeDiv.style.display = "block";
            form.reset();
            btn.disabled = false;
            btn.innerText = "GUARDAR REGISTRO";
        })
        .catch(error => {
            mensajeDiv.innerText = "❌ Error: " + error;
            mensajeDiv.style.backgroundColor = "#f8d7da";
            mensajeDiv.style.display = "block";
            btn.disabled = false;
            btn.innerText = "GUARDAR REGISTRO";
        });
    });
</script>

</body>
</html>
