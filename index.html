 <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz98xny-dI8JXlQo0Q4imoaIJ7eqtK9E_N-04jJ9UtkADzzgP-j3gBsXStq0UCoNF8aKQ/exec";
    let isProcessing = false;

    // ... (Funciones setFechaActual, limpiarFormulario y resizeImage se mantienen igual) ...

    document.getElementById('mainForm').onsubmit = async (e) => {
        e.preventDefault();
        if (isProcessing) return; // Bloqueo de seguridad

        const btn = document.getElementById('btnS');
        const st = document.getElementById('status');
        
        btn.disabled = true;
        st.style.display = "block";
        st.innerText = "⏳ Procesando...";
        st.style.color = "white";

        const payload = {
            id: "ID-" + Date.now(),
            hojaCodigo: document.getElementById('hojaCodigo').value || "SIN_ID",
            fechaHora: document.getElementById('fechaHora').value,
            duracion: document.getElementById('duracion').value,
            responsable: document.getElementById('responsable').value,
            tipo: document.getElementById('tipo').value,
            descripcion: document.getElementById('descripcion').value,
            fotoAntes: await resizeImage(document.getElementById('foto1').files[0]),
            fotoDespues: await resizeImage(document.getElementById('foto2').files[0])
        };

        if (navigator.onLine) {
            // INTENTO DE ENVÍO DIRECTO
            isProcessing = true;
            st.innerText = "🚀 Enviando a la nube...";
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(payload)
                });
                
                st.innerText = "✅ Registro Guardado!";
                st.style.color = "#00ff88";
                document.getElementById('mainForm').reset();
                setFechaActual();
                setTimeout(() => { st.style.display = "none"; btn.disabled = false; }, 2500);
            } catch (error) {
                // Si falla el envío aunque haya "línea", lo mandamos a la cola
                guardarEnPendientes(payload);
            } finally {
                isProcessing = false;
            }
        } else {
            // SIN INTERNET: A LA COLA DIRECTAMENTE
            guardarEnPendientes(payload);
        }
    };

    function guardarEnPendientes(item) {
        const btn = document.getElementById('btnS');
        const st = document.getElementById('status');
        
        let queue = JSON.parse(localStorage.getItem('form_queue_v4') || "[]");
        // Evitar duplicar en la cola si ya existe el ID
        if (!queue.some(q => q.id === item.id)) {
            queue.push(item);
            localStorage.setItem('form_queue_v4', JSON.stringify(queue));
        }
        
        st.innerText = "⚠️ Guardado localmente (Sin Internet)";
        st.style.color = "#ff9800";
        checkQueue();
        document.getElementById('mainForm').reset();
        setFechaActual();
        setTimeout(() => { st.style.display = "none"; btn.disabled = false; }, 3000);
    }

    async function processQueue() {
        // Solo procesa si hay internet, no se está procesando ya, y hay algo en la cola
        if (!navigator.onLine || isProcessing) return;
        
        let queue = JSON.parse(localStorage.getItem('form_queue_v4') || "[]");
        if (queue.length === 0) { checkQueue(); return; }

        isProcessing = true;

        for (let i = 0; i < queue.length; i++) {
            let item = queue[i];
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(item)
                });

                // Limpieza inmediata tras éxito
                let currentQueue = JSON.parse(localStorage.getItem('form_queue_v4') || "[]");
                currentQueue = currentQueue.filter(q => q.id !== item.id);
                localStorage.setItem('form_queue_v4', JSON.stringify(currentQueue));
                checkQueue(); // Actualiza el aviso naranja
            } catch (e) {
                console.error("Error en segundo plano:", e);
                break; 
            }
        }
        isProcessing = false;
    }

    function checkQueue() {
        let queue = JSON.parse(localStorage.getItem('form_queue_v4') || "[]");
        // Si la cola está vacía, ocultamos el aviso naranja definitivamente
        const pendingBox = document.getElementById('pendingInfo');
        if (queue.length === 0) {
            pendingBox.style.display = "none";
        } else {
            pendingBox.style.display = "block";
        }
    }

    window.addEventListener('online', processQueue);
    setInterval(processQueue, 30000); // Reintento cada 30 seg para dar tiempo a la red
</script>
